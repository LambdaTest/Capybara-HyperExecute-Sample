---
version: "0.1"
runson: mac
autosplit: true
maxRetries: 5
concurrency: 2
testDiscovery:
  type: raw
  mode: remote
  command: snooper --featureFilePaths=features/ --frameWork=java
testRunnerCommand: arch -x86_64 bundle exec cucumber "$test" --format html --out cucumber_results.html
pre:
  - arch -x86_64 bundle install --deployment
cacheKey: 'mac-x86-v1-{{ checksum "Gemfile.mac.lock" }}'
cacheDirectories:
  - ./vendor/bundle
report: true
partialReports:
 location: cucumber_results.html
 type: html
env:
   CONFIG_NAME: "mac"
   BUNDLE_GEMFILE: "Gemfile.mac"

jobLabel: [selenium-capybara, mac, autosplit-simple]