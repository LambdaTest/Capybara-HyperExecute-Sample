---
version: "0.1"
matrix:
  os: [mac]
  files: ["features/todo1.feature", "features/todo2.feature"]
runson: ${matrix.os}
testSuites:
  - arch -x86_64 bundle exec cucumber "$files" --format html --out cucumber_results.html
pre:
  - arch -x86_64 bundle install --deployment
cacheKey: 'mac-x86-v1-{{ checksum "Gemfile.mac.lock" }}'
cacheDirectories:
  - ./vendor/bundle
uploadArtefacts:
 - name: report
   path:
     - cucumber_results.html
report: true
partialReports:
 location: cucumber_results.html
 type: html

env:
   CONFIG_NAME: "mac"
   BUNDLE_GEMFILE: "Gemfile.mac"

jobLabel: [selenium-capybara, mac, matrix]